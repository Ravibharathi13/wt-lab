<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Info Manager</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    input, button { margin: 5px; padding: 8px; }
    table { margin-top: 20px; border-collapse: collapse; width: 100%; }
    th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
  </style>
</head>
<body>
  <h2>Personal Information Manager</h2>
  <form id="personForm">
    <input type="hidden" id="id" />
    <input type="text" id="name" placeholder="Name" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="text" id="phone" placeholder="Phone" required />
    <input type="text" id="address" placeholder="Address" required />
    <button type="submit">Save</button>
  </form>
  <table id="dataTable">
    <thead>
      <tr>
        <th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <script>
    async function fetchPersons() {
      const res = await fetch('/api/persons');
      const data = await res.json();
      const tbody = document.querySelector('#dataTable tbody');
      tbody.innerHTML = '';
      data.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td>${p.name}</td>
            <td>${p.email}</td>
            <td>${p.phone}</td>
            <td>${p.address}</td>
            <td>
              <button onclick='editPerson(${JSON.stringify(p)})'>Edit</button>
              <button onclick='deletePerson("${p._id}")'>Delete</button>
            </td>
          </tr>`;
      });
    }

    function editPerson(p) {
      document.getElementById('id').value = p._id;
      document.getElementById('name').value = p.name;
      document.getElementById('email').value = p.email;
      document.getElementById('phone').value = p.phone;
      document.getElementById('address').value = p.address;
    }

    async function deletePerson(id) {
      await fetch(`/api/persons/${id}`, { method: 'DELETE' });
      fetchPersons();
    }

    document.getElementById('personForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('id').value;
      const person = {
        name: name.value,
        email: email.value,
        phone: phone.value,
        address: address.value
      };
      if (id) {
        await fetch(`/api/persons/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(person)
        });
      } else {
        await fetch('/api/persons', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(person)
        });
      }
      document.getElementById('personForm').reset();
      fetchPersons();
    });

    fetchPersons();
  </script>
</body>
</html>
