<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Student Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
function validateForm() {
    let form = document.forms["regForm"];
    let name = form["name"].value.trim();
    let email = form["email"].value.trim();
    let phone = form["phone"].value.trim();
    let dob = form["dob"].value;
    let age = form["age"].value.trim();
    let gender = document.querySelector('input[name="gender"]:checked');
    let address = form["address"].value.trim();
    let city = form["city"].value.trim();
    let state = form["state"].value.trim();
    let nationality = form["nationality"].value.trim();
  
    let password = form["password"].value.trim();
    let confirmPassword = form["confirmPassword"].value.trim();

    let namePattern = /^[A-Za-z ]+$/;
    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    let phonePattern = /^[0-9]{10}$/;
    let passwordPattern = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,}$/;

    if (!name.match(namePattern)) {
        alert("Name must contain only letters and spaces");
        return false;
    }
    if (!email.match(emailPattern)) {
        alert("Please enter a valid email address");
        return false;
    }
    if (!phone.match(phonePattern)) {
        alert("Please enter a valid 10-digit phone number");
        return false;
    }
    if (dob === "") {
        alert("Please select your date of birth");
        return false;
    }
    if (age === "" || isNaN(age) || age < 5 || age > 120) {
        alert("Please enter a valid age between 5 and 120");
        return false;
    }
    if (!gender) {
        alert("Please select your gender");
        return false;
    }
    if (address === "" || city === "" || state === "") {
        alert("Address fields cannot be empty");
        return false;
    }
    if (nationality === "") {
        alert("Please enter your nationality");
        return false;
    }
 
    if (!password.match(passwordPattern)) {
        alert("Password must be at least 6 characters long and include letters and numbers");
        return false;
    }
    if (password !== confirmPassword) {
        alert("Passwords do not match");
        return false;
    }
    return true;
}

    </script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="form-container">
            <h2 class="text-center text-primary">Student Registration</h2>
            <form name="regForm" onsubmit="return validateForm()">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Enter full name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter email">
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" name="phone" class="form-control" placeholder="Enter phone number">
                </div>
                <div class="mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" name="dob" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Age</label>
                    <input type="number" name="age" class="form-control" placeholder="Enter age">
                </div>
                <div class="mb-3">
                    <label class="form-label">Gender</label><br>
                    <input type="radio" name="gender" value="Male"> Male
                    <input type="radio" name="gender" value="Female"> Female
                    <input type="radio" name="gender" value="Other"> Other
                </div>
                <div class="mb-3">
                    <label class="form-label">Nationality</label>
                    <input type="text" name="nationality" class="form-control" placeholder="Enter nationality">
                </div>
           
                <div class="mb-3">
                    <label class="form-label">Address</label>
                    <input type="text" name="address" class="form-control" placeholder="Enter your address">
                </div>
                <div class="mb-3">
                    <label class="form-label">City</label>
                    <input type="text" name="city" class="form-control" placeholder="Enter city">
                </div>
                <div class="mb-3">
                    <label class="form-label">State</label>
                    <input type="text" name="state" class="form-control" placeholder="Enter state">
                </div>
                <div class="mb-3">
                    <label class="form-label">Select Course</label>
                    <select name="course" class="form-control">
                        <option value="">Select a course</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Business">Business</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Medicine">Medicine</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password">
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirmPassword" class="form-control" placeholder="Confirm password">
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
        </div>
    </div>
</body>
</html>
