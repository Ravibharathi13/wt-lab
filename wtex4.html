<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 500px;
            margin-top: 50px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .container:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        h2 {
            color: #007bff;
            text-align: center;
            margin-bottom: 20px;
        }
        .btn-custom {
            background: linear-gradient(45deg, #007bff, #6610f2);
            border: none;
            color: white;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-custom:hover {
            background: linear-gradient(45deg, #6610f2, #007bff);
            transform: scale(1.05);
        }
        .result-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
        .hidden {
            display: none;
        }
        .payment-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }
        .payment-icons a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 120px;
            height: 50px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            color: white;
            padding: 10px;
        }
        .btn-googlepay { background-color: #4285F4; }
        .btn-paypal { background-color: #003087; }
        .btn-card { background-color: #28a745; }
        .btn-upi { background-color: #ff9900; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Library Bill Calculator</h2>
        <form>
            <div class="mb-3">
                <label for="userName" class="form-label">Your Name:</label>
                <input type="text" id="userName" class="form-control" placeholder="Enter your name">
            </div>
            <div class="mb-3">
                <label for="daysLate" class="form-label">Days Late:</label>
                <input type="number" id="daysLate" class="form-control" min="0" oninput="calculateBill()">
            </div>
            <div class="mb-3">
                <label for="booksLate" class="form-label">Number of Books:</label>
                <input type="number" id="booksLate" class="form-control" min="1" oninput="calculateBill()">
            </div>
            <div class="mb-3">
                <label for="bookCondition" class="form-label">Book Condition:</label>
                <select id="bookCondition" class="form-control" onchange="calculateBill()">
                    <option value="0">Good</option>
                    <option value="5">Damaged (+₹5 per book)</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="membership" class="form-label">Membership Status:</label>
                <select id="membership" class="form-control" onchange="calculateBill()">
                    <option value="0">Non-Member</option>
                    <option value="1">Member (20% Discount)</option>
                </select>
            </div>
            <button type="button" class="btn btn-custom w-100" onclick="calculateBill()">Calculate</button>
            <button type="button" class="btn btn-secondary w-100 mt-2" onclick="resetForm()">Reset</button>
        </form>
        <div class="result-box"><span id="userGreeting"></span> Total Fine: ₹<span id="totalBill">0</span></div>
        <button type="button" class="btn btn-success w-100 mt-3" onclick="showPaymentOptions()">Pay Now</button>
        
        <div id="paymentOptions" class="hidden mt-3">
    <h4>Select Payment Method</h4>
    <div class="payment-icons">
        <a href="google.com/" target="_blank" class="btn btn-googlepay">
            <i class="fab fa-google-pay fa-2x"></i><br>Google Pay
        </a>
        <a href="paypal.com/" target="_blank" class="btn btn-paypal">
            <i class="fab fa-paypal fa-2x"></i><br>PayPal
        </a>
        <a href="#" target="_blank" class="btn btn-upi">
            <i class="fas fa-university fa-2x"></i><br>UPI
        </a>
    </div>
</div>
</div>
    <script>
        function calculateBill() {
            let userName = document.getElementById('userName').value.trim();
            let daysLate = parseInt(document.getElementById('daysLate').value) || 0;
            let booksLate = parseInt(document.getElementById('booksLate').value) || 0;
            let bookCondition = parseInt(document.getElementById('bookCondition').value);
            let isMember = parseInt(document.getElementById('membership').value);
            
            let totalFine = (daysLate * booksLate * 1) + (bookCondition * booksLate);
            if (isMember) {
                totalFine *= 0.8;
            }
            
            let greeting = userName ? `${userName}, your` : "Your";
            document.getElementById('userGreeting').innerText = greeting;
            document.getElementById('totalBill').innerText = totalFine.toFixed(2);
        }

        function resetForm() {
            document.getElementById('userName').value = "";
            document.getElementById('daysLate').value = "";
            document.getElementById('booksLate').value = "";
            document.getElementById('bookCondition').value = "0";
            document.getElementById('membership').value = "0";
            document.getElementById('userGreeting').innerText = "";
            document.getElementById('totalBill').innerText = "0";
            document.getElementById('paymentOptions').classList.add("hidden");
        }

        function showPaymentOptions() {
            document.getElementById('paymentOptions').classList.remove("hidden");
        }
    </script>
</body>
</html>
